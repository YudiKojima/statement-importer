name: statement-importer

x-db-env: &db-env
  Db__Host: postgres
  Db__Database: statement_importer

x-rabbitmq-env: &rabbitmq-env
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: importer
  RabbitMq__Password: importer

x-build-args: &build-args
  VERSION: ${VERSION:-dev}
  REVISION: ${REVISION:-unknown}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: statement_importer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, db_owner_password, db_app_password]
    configs:
      - source: init-roles
        target: /docker-entrypoint-initdb.d/10-init-roles.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d statement_importer"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: importer
      RABBITMQ_DEFAULT_PASS: importer
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  migrator:
    build:
      context: .
      dockerfile: src/StatementImporter.Data/Dockerfile
      target: runtime
      args: *build-args
    image: ghcr.io/yudikojima/statement-importer-migrator:${TAG:-local}
    environment:
      <<: *db-env
      Db__Username: importer_owner
    secrets:
      - source: db_owner_password
        target: Db__Password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: src/StatementImporter.Api/Dockerfile
      target: runtime
      args: *build-args
    image: ghcr.io/yudikojima/statement-importer-api:${TAG:-local}
    environment:
      <<: [*db-env, *rabbitmq-env]
      Db__Username: importer_app
    secrets:
      - source: db_app_password
        target: Db__Password
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: src/StatementImporter.Worker/Dockerfile
      target: runtime
      args: *build-args
    image: ghcr.io/yudikojima/statement-importer-worker:${TAG:-local}
    environment:
      <<: [*db-env, *rabbitmq-env]
      Db__Username: importer_app
    secrets:
      - source: db_app_password
        target: Db__Password
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [internal]

  proxy:
    build:
      context: .
      dockerfile: src/StatementImporter.Web/Dockerfile
      target: runtime
      args: *build-args
    image: ghcr.io/yudikojima/statement-importer-proxy:${TAG:-local}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, internal]

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_owner_password:
    file: ./secrets/db_owner_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt

configs:
  init-roles:
    file: ./docker/postgres/init-roles.sh

volumes:
  pgdata:
  uploads:

networks:
  internal:
    internal: true
  public:
